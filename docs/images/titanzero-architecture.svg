<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">Titan Zero PHP Modules Archive architecture</title><desc id="desc">AI agents and citations feed actions, contracts, guided workflows, evaluation, and platform administration within a Laravel module archive.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#241a29"/><stop offset="1" stop-color="#684a64"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#f4b68f"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#f4b68f}.t{font:700 32px Segoe UI,Arial;fill:#fff7f2}.s{font:400 15px Segoe UI,Arial;fill:#edd9d4}.n{fill:#53334f;stroke:#b57c80;stroke-width:2}.g{fill:#6b4e67;stroke:#f4b68f;stroke-width:2}.y{fill:#3e4e5b;stroke:#aee5ff;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#edd9d4}.q{font:400 12px Segoe UI,Arial;fill:#d9c0c0}.r{stroke:#f4b68f;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">PHP MODULE ARCHIVE � SOURCE MAP</text><text x="64" y="106" class="t">Guided assistance sits beside explicit evaluation and administration layers</text><text x="64" y="136" class="s">Source-backed from AI/, Actions/, Blueprints/, Canvas/, Evaluation/, Wizards/, Services/, and module manifests.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">AI + Citations</text><text x="195" y="290" text-anchor="middle" class="b">assistive context</text><text x="195" y="318" text-anchor="middle" class="q">not autonomous authority</text><path d="M320 285H420" class="r"/><rect x="420" y="220" width="250" height="130" rx="16" class="g"/><text x="545" y="260" text-anchor="middle" class="l">Actions + Contracts</text><text x="545" y="290" text-anchor="middle" class="b">bounded operations</text><text x="545" y="318" text-anchor="middle" class="q">tool invocation records</text><path d="M670 285H770" class="r"/><rect x="770" y="220" width="250" height="130" rx="16" class="g"/><text x="895" y="260" text-anchor="middle" class="l">Canvas + Wizards</text><text x="895" y="290" text-anchor="middle" class="b">guided workflows</text><text x="895" y="318" text-anchor="middle" class="q">session + UI state</text><path d="M1020 285H1120" class="r"/><rect x="1120" y="220" width="310" height="130" rx="16" class="y"/><text x="1275" y="260" text-anchor="middle" class="l">Evaluation + Platform</text><text x="1275" y="290" text-anchor="middle" class="b">tests � providers � admin</text><text x="1275" y="318" text-anchor="middle" class="q">lineage remains under review</text><path d="M1275 350V510H750" class="r"/><rect x="460" y="530" width="580" height="92" rx="16" class="n"/><text x="750" y="567" text-anchor="middle" class="l">Laravel module boundary</text><text x="750" y="594" text-anchor="middle" class="q">manifest + provider integration � exploratory status</text></svg>

